# Infrastructure locale de développement : `docker compose up -d`
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: snapcore
      POSTGRES_PASSWORD: snapcore
      POSTGRES_DB: snapcore
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Redis partagé : BullMQ, présence, vues de stories, pub/sub Socket.io.
  # AOF + noeviction sont exigés par ADR-017 (les jobs de purge ne doivent jamais disparaître).
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
